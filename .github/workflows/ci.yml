name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify macOS ARM64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal

      - name: Verify
        run: pnpm verify

      - name: Build macOS ARM64 installer assets
        run: pnpm macos:script-installer:build

      - name: Check installer assets
        run: |
          test -f build/macos-script-installer/install-macos-native-host.sh
          test -f build/macos-script-installer/checksums.txt
          test -f build/macos-script-installer/hover-trans-port-helper-macos-arm64
          test -f build/macos-script-installer/hover-trans-port-native-host-macos-0.2.10.tar.gz
          cd build/macos-script-installer
          shasum -a 256 -c checksums.txt
