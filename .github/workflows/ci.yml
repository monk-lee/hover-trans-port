name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-windows-provider:
    name: Codex Windows provider tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal

      - name: Run Codex provider tests
        run: cargo test --manifest-path native-helper/Cargo.toml --lib providers::codex::tests -- --nocapture

  verify:
    name: Verify macOS ARM64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal

      - name: Verify
        run: pnpm verify

      - name: Build macOS ARM64 installer assets
        run: pnpm macos:script-installer:build

      - name: Check installer assets
        run: |
          test -f build/macos-script-installer/install-macos-native-host.sh
          test -f build/macos-script-installer/checksums.txt
          test -f build/macos-script-installer/hover-trans-port-helper-macos-arm64
          test -f build/macos-script-installer/hover-trans-port-native-host-macos-0.2.17.tar.gz
          cd build/macos-script-installer
          shasum -a 256 -c checksums.txt

  native-host-installer-smoke:
    name: Native host installer smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build native host helper
        run: cargo build --release --manifest-path native-helper/Cargo.toml

      - name: Run native host installer smoke
        run: node scripts/native-host-installer-smoke.mjs

  native-host-linux-assets:
    name: Native host release assets Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Build Linux native host release assets
        run: |
          rm -rf build/native-host-release-assets/linux

          cargo build --release --manifest-path native-helper/Cargo.toml --target x86_64-unknown-linux-gnu
          node scripts/build-native-host-release-assets.mjs \
            --platform linux \
            --asset hover-trans-port-helper-linux-x64 \
            --helper native-helper/target/x86_64-unknown-linux-gnu/release/hover-trans-port-helper \
            --out-dir build/native-host-release-assets/linux

          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --manifest-path native-helper/Cargo.toml --target aarch64-unknown-linux-gnu
          node scripts/build-native-host-release-assets.mjs \
            --platform linux \
            --asset hover-trans-port-helper-linux-arm64 \
            --helper native-helper/target/aarch64-unknown-linux-gnu/release/hover-trans-port-helper \
            --out-dir build/native-host-release-assets/linux

          (
            cd build/native-host-release-assets/linux
            shasum -a 256 -c checksums.txt
            test -f hover-trans-port-native-host-linux-0.2.17.tar.gz
          )

  native-host-windows-assets:
    name: Native host release assets Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Build Windows x64 native host release asset
        shell: pwsh
        run: |
          Remove-Item -LiteralPath build/native-host-release-assets/windows -Recurse -Force -ErrorAction SilentlyContinue

          cargo build --release --manifest-path native-helper/Cargo.toml --target x86_64-pc-windows-msvc
          node scripts/build-native-host-release-assets.mjs `
            --platform windows `
            --asset hover-trans-port-helper-windows-x64.exe `
            --helper native-helper/target/x86_64-pc-windows-msvc/release/hover-trans-port-helper.exe `
            --out-dir build/native-host-release-assets/windows

      - name: Build Windows ARM64 native host release asset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio ARM64 C++ tools were not found."
          }
          $vcvarsAll = Join-Path $installationPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path -LiteralPath $vcvarsAll)) {
            throw "vcvarsall.bat was not found: $vcvarsAll"
          }
          $cmdPath = Join-Path $env:TEMP "hover-trans-port-build-windows-arm64.cmd"
          @"
          @echo off
          call "$vcvarsAll" amd64_arm64
          if errorlevel 1 exit /b %errorlevel%
          cargo build --release --manifest-path native-helper/Cargo.toml --target aarch64-pc-windows-msvc
          if errorlevel 1 exit /b %errorlevel%
          node scripts/build-native-host-release-assets.mjs --platform windows --asset hover-trans-port-helper-windows-arm64.exe --helper native-helper/target/aarch64-pc-windows-msvc/release/hover-trans-port-helper.exe --out-dir build/native-host-release-assets/windows
          if errorlevel 1 exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $cmdPath -Encoding ASCII
          & cmd.exe /d /s /c "`"$cmdPath`""
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check Windows native host assets
        shell: pwsh
        run: |
          $nativeDir = "build/native-host-release-assets/windows"
          Get-Content -LiteralPath (Join-Path $nativeDir "checksums.txt") | ForEach-Object {
            $parts = $_ -split "\s+", 2
            $expected = $parts[0].ToLowerInvariant()
            $fileName = $parts[1].Trim()
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $nativeDir $fileName)).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "checksum mismatch for $fileName"
            }
          }

          if (-not (Test-Path -LiteralPath (Join-Path $nativeDir "hover-trans-port-native-host-windows-0.2.17.zip"))) {
            throw "missing Windows inspect-first package"
          }
