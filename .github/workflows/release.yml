name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: macos-15
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal

      - name: Verify
        run: pnpm verify

      - name: Build extension
        run: pnpm build

      - name: Build macOS ARM64 installer assets
        run: pnpm macos:script-installer:build

      - name: Package extension zip
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          EXTENSION_ZIP="build/release/hover-trans-port-extension-${TAG_NAME}.zip"

          mkdir -p build/release
          rm -f "$EXTENSION_ZIP"
          (
            cd dist
            zip -qr "../$EXTENSION_ZIP" .
          )

          test -f "$EXTENSION_ZIP"
          unzip -l "$EXTENSION_ZIP"

      - name: Write release notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          mkdir -p build/release
          cat > build/release/release-notes.md <<EOF
          ${TAG_NAME}

          This release targets macOS, Google Chrome, and local provider CLIs.

          Assets:
          - install-macos-native-host.sh: one-line native host installer
          - checksums.txt: SHA-256 checksums for native host assets
          - hover-trans-port-helper-macos-arm64: macOS ARM64 native helper
          - hover-trans-port-native-host-macos-0.2.9.tar.gz: inspect-first native host package
          - hover-trans-port-extension-${TAG_NAME}.zip: unpacked Chrome extension package built from dist/

          Highlights:
          - Shows selected-text translations in a fixed bubble anchored to the selected range.
          - Keeps hovered readable block translations inline so paragraph reading flow is unchanged.
          - Adds bubble dismissal with outside click, Escape, page scroll, and resize while preserving internal bubble scrolling.
          - Guards against stale selection and hover responses replacing newer translation UI.

          Native host update required:
          - Existing v0.2.4 installs that still report helper version v0.2.3 need one manual install command because their persisted updater copied the old helper.
          - Existing v0.2.5 and later native hosts can install future releases from Options with user confirmation.
          - Existing v0.2.2 and older native hosts do not understand update messages. Run the latest install script once, then reload the extension.

          Next:
          - Future update-capable native host releases can continue to be installed from Options with user confirmation.

          Install docs: https://github.com/monk-lee/hover-trans-port/blob/${TAG_NAME}/docs/native-host-install.md
          Privacy: https://github.com/monk-lee/hover-trans-port/blob/${TAG_NAME}/PRIVACY.md

          This is not a Chrome Web Store release. Load the extension package manually through chrome://extensions.
          EOF

      - name: Check release assets
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          NATIVE_DIR="build/macos-script-installer"
          EXTENSION_ZIP="build/release/hover-trans-port-extension-${TAG_NAME}.zip"

          test -f "$NATIVE_DIR/install-macos-native-host.sh"
          test -f "$NATIVE_DIR/checksums.txt"
          test -f "$NATIVE_DIR/hover-trans-port-helper-macos-arm64"
          test -f "$NATIVE_DIR/hover-trans-port-native-host-macos-0.2.9.tar.gz"
          test -f "$EXTENSION_ZIP"
          test -f build/release/release-notes.md

          (
            cd "$NATIVE_DIR"
            shasum -a 256 -c checksums.txt
          )

      - name: Publish release
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          NATIVE_DIR="build/macos-script-installer"
          EXTENSION_ZIP="build/release/hover-trans-port-extension-${TAG_NAME}.zip"

          gh release create "$TAG_NAME" \
            "$NATIVE_DIR/install-macos-native-host.sh" \
            "$NATIVE_DIR/checksums.txt" \
            "$NATIVE_DIR/hover-trans-port-helper-macos-arm64" \
            "$NATIVE_DIR/hover-trans-port-native-host-macos-0.2.9.tar.gz" \
            "$EXTENSION_ZIP" \
            --verify-tag \
            --latest \
            --title "$TAG_NAME" \
            --notes-file build/release/release-notes.md
