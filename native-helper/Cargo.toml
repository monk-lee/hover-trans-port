[package]
name = "hover-trans-port-helper"
version = "0.2.3"
edition = "2021"

[lib]
name = "hover_trans_port_helper"
path = "src/lib.rs"

[[bin]]
name = "hover-trans-port-helper"
path = "src/main.rs"

[dependencies]
dirs = "6"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
wait-timeout = "0.2"
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
